aid: ss-c-technologies
name: SS&C Technologies
description: >-
  SS&C Technologies Holdings (NASDAQ: SSNC) is a global provider of financial-services and healthcare
  software and outsourcing, headquartered in Windsor, Connecticut, operating under brands including
  SS&C Advent, SS&C Eze, SS&C GlobeOp, SS&C GIDS, SS&C Intralinks, SS&C Black Diamond, SS&C Algorithmics
  and SS&C Blue Prism. Most of the API surface is client-gated: the corporate SS&C APIM developer portal
  at developer.ssctech.com and the Black Diamond developer portal both require an account, and access is
  requested through a client relationship manager. The substantial public exception is SS&C Eze EMS xAPI,
  whose machine-readable contract SS&C Eze publishes openly on GitHub as three proto3 files — 64 gRPC
  RPCs across MarketDataService, SubmitOrderService and UtilityServices — alongside a matching REST
  projection described by a live OpenAPI 3.0.4 document with 73 operations covering order submission and
  amendment, pair and basket orders, allocations and trade reports, real-time and historical market data,
  and intraday balances, positions and activity.
