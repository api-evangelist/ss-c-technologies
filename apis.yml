apis:
- name: SS&C Eze EMS xAPI
  description: >-
    Cross-platform execution-management API for Eze EMS, published by SS&C Eze as a gRPC contract
    (three proto3 files, 64 RPCs across MarketDataService, SubmitOrderService and UtilityServices)
    with an equivalent REST projection described by OpenAPI 3.0.4 (73 operations, 123 schemas).
    Covers connect/authenticate (including SRP and MFA), single, pair, basket, allocation and
    book-trade order submission, amendment and cancellation, order and execution detail retrieval,
    streaming order and market-data subscriptions, symbol reference data, option chains and greeks,
    and today's balances, net positions and activity. Bearer JWT on REST; a UserToken returned by
    Connect is carried on every subsequent call.
  humanURL: https://github.com/ezesoft/xapi
  baseURL: https://emsuatxapi.taltrade.com:9001
  tags:
