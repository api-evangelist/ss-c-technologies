- name: SS&C APIM Developer Portal
  description: >-
    SS&C's corporate API management portal, where clients register applications, request access to
    SS&C API products and manage consumers against a Kong gateway. The API catalog itself is behind
    authentication — every catalog endpoint 302s to an SSO login — and access is granted by a client
    relationship manager, so no machine-readable contract is reachable anonymously. The Keycloak
    realm backing it serves a public OpenID Connect discovery document.
  humanURL: https://developer.ssctech.com/
  baseURL: https://apim.ssnc.cloud
  tags:
  - Financial Services
  - API Management
  tags_raw:
  - financial-services
  - api-management
  properties:
  - type: DeveloperPortal
    url: https://developer.ssctech.com/
  - type: SignUp
    url: https://developer.ssctech.com/register
  - type: OpenIDConnect
    url: https://ssoprod.ssnc.cloud/auth/realms/APIM/.well-known/openid-configuration
  - type: OAuthScopes
    url: scopes/ss-c-technologies-scopes.yml
- name: SS&C Black Diamond Wealth Platform API
  description: >-
    REST API and developer portal for the SS&C Advent Black Diamond wealth platform, covering
    portfolio, account and client data exchange for advisors and integration partners. The portal
    requires sign-in; new partners apply through a request form and existing clients request access
    through their Black Diamond account, so the OpenAPI 3 specification SS&C describes in its product
    material is not reachable without credentials.
  humanURL: https://www.blackdiamondwealthplatform.com/
  baseURL: https://api.blackdiamondwealthplatform.com
