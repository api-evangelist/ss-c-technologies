    sunset: false
    deprecation: false
  spec_deprecated_operations: 0
  detail: >-
    SS&C Eze states a real, dated-in-direction deprecation in its own FAQ: the legacy Eze EMS Excel
    API "is now in maintenance-only mode with no future roadmap", EMS xAPI "will eventually replace"
    it, and xAPI "supports all legacy Excel API capabilities". That is a genuine published
    end-of-life direction for a shipping product, which is why a Deprecation pointer is wired. What
    it is NOT is an API deprecation policy: no end-of-support date is given, no notice period is
    stated, and no operation in the OpenAPI carries `deprecated: true` even though ten v1
    operations now have v2 successors.
  quotes:
