domain_standards:
- id: securities-identifier-schemes
  conforms: true
  standard: ISIN (ISO 6166), SEDOL, CUSIP, RIC, Bloomberg (BBG)
  evidence: >-
    grpc/ss-c-technologies-xapi-market-data.proto, message AlternateSymbology, enum Symbology:
    ISIN = 0; SEDOL = 1; RIC = 2; CUSIP = 3; BBG = 4. Surfaced over REST at
    GET /api/v1/security/symbol-from-alternate-symbology, which resolves any of these to an Eze
    symbol in single or bulk form. A counterparty that already carries ISINs or CUSIPs needs no
    bespoke mapping table to trade through this API, which is precisely the integration cost this
    check measures.
- id: iso-10383-mic
  conforms: true
  standard: ISO 10383 Market Identifier Code
  evidence: >-
    grpc/ss-c-technologies-xapi-market-data.proto line 545 declares `string MIC = 56;` on the
    Level 1 market-data record, so venue is reported as an ISO 10383 MIC rather than a
    vendor-private venue code.
- id: fix-order-semantics
  conforms: partial
  standard: FIX Protocol order vocabulary
  evidence: >-
    The order model reuses FIX semantics directly rather than inventing its own: TimeInForce is
    ExpirationTypes {DAY, GTC, GTX, CLO, OPG, IOC, GTD, OTHER} — FIX tag 59 values — and PriceType
    is PriceTypesEnum {Market, Limit, StopMarket, StopLimit, Other} — FIX tag 40. SS&C's own FAQ
    additionally instructs users to set FIX field ID 31640
    (COMPLIANCE_USER_OPTION_FLAGS) to trigger automated compliance checks on an xAPI-originated
    order, which is a FIX tag crossing the API boundary in the documentation.
  qualifier: >-
    Marked `partial`, not `true`: xAPI is a gRPC/REST API that speaks FIX's vocabulary, not a FIX
    session-layer implementation, and SS&C declares no FIX version (4.2/4.4/5.0 SP2) anywhere in
    the contract or docs. A buyer who already speaks FIX will recognise every field; a buyer who
    wants a FIX session still needs a different connection.
