agent_readiness_note: >-
  Two properties of this API would have to be resolved before an agent should be pointed at it
  unsupervised, and both are recorded elsewhere in this repo: there is no idempotency mechanism on
  any of the 30 mutating operations (conventions/), and the reversal operations that do exist carry
  no stated window (conventions/ reversibility). Order submission is a real-money write.
