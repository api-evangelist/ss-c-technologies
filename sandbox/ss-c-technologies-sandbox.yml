summary: >-
  SS&C Eze publishes UAT endpoints for both xAPI transports and they answer anonymously, but the
  environment is not a self-serve sandbox: there are no test credentials, no demo account and no
  published test data. A client service representative provisions the server, port, user, domain and
  route values, and every tutorial script ships with those five values as __SERVER__, __PORT__,
  __USER__, __PASSWORD__ and __DOMAIN__ placeholders the reader must fill in. What a developer CAN
  do without an account is read the complete contract and browse the live Swagger UI.
environments:
